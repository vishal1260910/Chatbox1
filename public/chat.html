<!DOCTYPE html>
<html lang="en" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Application</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

  <!-- Bootstrap RTL -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" />

  <style>
    body {
      <style>
  body {
    background: url('https://www.transparenttextures.com/patterns/cubes.png') repeat;
    background-size: auto;
    font-family: 'Segoe UI', sans-serif;
  }

  #chat-box li {
    background: rgba(255, 255, 255, 0.9);
    margin: 0.5rem;
    padding: 0.8rem;
    border-radius: 0.8rem;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    backdrop-filter: blur(2px);
  }

  .fixed-bottom {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(2px);
  }

  .modal-content {
    border-radius: 1rem;
    background-color: #ffffff;
  }

  .bg-primary {
    background-color: #007bff !important;
  }

  #online-users-list {
    white-space: nowrap;
  }
</style>

  </style>
</head>

<body class="bg-info text-dark">

  <div class="container-fluid p-2">
    <!-- Top bar with online users -->
    <div class="bg-primary text-white rounded p-2 mb-2">
      <ul id="online-users-list" class="list-inline mb-0 overflow-auto"></ul>
    </div>

    <!-- Chat Container -->
    <div class="position-relative" style="height: calc(100vh - 150px); overflow-y: auto;">
      <ul id="chat-box" class="list-unstyled mt-2"></ul>
      <div id="feedback" class="px-3"></div>
    </div>

    <!-- Chat input fixed to bottom -->
    <div class="fixed-bottom bg-white p-3 border-top shadow">
      <form id="chatForm" class="d-flex gap-2">
        <input type="text" name="message" id="messageInput" class="form-control" placeholder="Type your message..." />
        <button type="submit" class="btn btn-primary">
          <i class="fas fa-paper-plane"></i> Send
        </button>
      </form>
    </div>
  </div>

  <!-- Private Chat Modal -->
  <div class="modal fade" id="pvChat" tabindex="-1" aria-labelledby="pvChatModal" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content shadow">
        <div class="modal-header">
          <h5 class="modal-title" id="modalTitle">Private Chat</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="pvChatMessage" class="alert alert-success p-2 mb-3"></div>
          <form id="pvChatForm">
            <div class="form-group mb-3">
              <label for="pvMessageInput" class="form-label">Message:</label>
              <textarea class="form-control" id="pvMessageInput" rows="3" placeholder="Write your private message..."></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">
              <i class="fas fa-paper-plane"></i> Send Message
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.3.2/socket.io.min.js"></script>
  <script src="js/chat.js"></script>
</body>

</html>
