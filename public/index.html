<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Login</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />

  <style>
    body {
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 400px;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .form-control,
    select {
      border-radius: 0.5rem;
    }

    .form-icon {
      font-size: 3rem;
      color: #2575fc;
    }

    .form-title {
      font-weight: 600;
      margin-bottom: 1rem;
    }

    button {
      border-radius: 0.5rem;
    }
  </style>
</head>

<body>
  <div class="card bg-white text-center">
    <div class="mb-3">
      <i class="fas fa-comments form-icon"></i>
    </div>
    <h2 class="form-title">Welcome to ChatBox</h2>
    <form id="nicknameForm">
      <div class="mb-3 text-start">
        <label for="nicknameInput" class="form-label">Username</label>
        <input type="text" name="nickname" id="nicknameInput" class="form-control" placeholder="Enter your username" required autofocus />
      </div>
      <div class="mb-3 text-start">
        <label for="chatrooms" class="form-label">Choose a Chat Room</label>
        <select name="chatrooms" id="chatrooms" class="form-select" required>
          <option value="room1">Chat Room 1</option>
          <option value="room2">Chat Room 2</option>
          <option value="room3">Chat Room 3</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary w-100">
        <i class="fas fa-sign-in-alt me-2"></i> Enter Chat
      </button>
    </form>
  </div>

  <script>
    const nicknameForm = document.getElementById("nicknameForm");
    const nicknameInput = document.getElementById("nicknameInput");
    const chatroom = document.getElementById("chatrooms");

    nicknameForm.addEventListener("submit", (e) => {
      e.preventDefault();
      if (nicknameInput.value) {
        localStorage.setItem("nickname", nicknameInput.value);
        localStorage.setItem("chatroom", chatroom.value);
        window.location.replace("/chat.html");
      }
    });
  </script>
</body>

</html>
